name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax / tests / package
        run: npm run ci
      - name: Package check
        run: |
          unzip -t dist/navitime-gpx-exporter-firefox-0.0.1.zip
          unzip -t dist/navitime-gpx-exporter-chrome-0.0.1.zip
          unzip -t dist/navitime-gpx-exporter-edge-0.0.1.zip
      - name: Upload ZIP artifacts
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: dist/*.zip
          retention-days: 14
