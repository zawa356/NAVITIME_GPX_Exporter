name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax / tests / package
        run: npm run ci
      - name: Package check
        run: |
          unzip -t dist/navitime-gpx-exporter-firefox-0.0.1.zip
          unzip -t dist/navitime-gpx-exporter-chrome-0.0.1.zip
          unzip -t dist/navitime-gpx-exporter-edge-0.0.1.zip
      - name: Upload ZIP artifacts
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: dist/*.zip
          retention-days: 14

  tag-development-milestones:
    name: Tag development milestones
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable 0.0.x tags from milestone commit subjects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          while IFS=$'\t' read -r sha subject; do
            if [[ "$subject" =~ \((0\.0\.[0-9]+)\)$ ]]; then
              tag="${BASH_REMATCH[1]}"
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                existing=$(git rev-list -n 1 "$tag")
                if [[ "$existing" != "$sha" ]]; then
                  echo "::error::Tag $tag points to $existing, expected $sha"
                  exit 1
                fi
              else
                git tag "$tag" "$sha"
                echo "Created $tag at $sha"
              fi
            fi
          done < <(git log --format='%H%x09%s')
          git push origin --tags
