<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAVITIME GPX Exporter</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><h1>NAVITIME GPX Exporter</h1><small>非公式ツール</small></header>
<section id="summary" aria-live="polite"><p id="status">走行ログを確認しています…</p>
<p id="kindLabel" hidden></p><h2 id="rideTitle" hidden></h2><p id="rideDate" hidden></p></section>
<button type="button" id="export" disabled>GPXを保存</button>
<button type="button" class="quiet" id="retry" hidden>再試行</button>
<details id="diagnostics" hidden><summary>技術的な詳細</summary><pre id="diagnosticText"></pre>
<button type="button" class="quiet" id="copy">診断情報をコピー</button></details>
<footer>表示中の走行ログ・保存済みルート1件を出力</footer>
</main><script src="popup.js"></script></body></html>
